# mypy 全仓静态检查配置（2026-10 全量类型注解战役配套）
# 原则：自有代码 rvc/ gui/ 全量注解（disallow_untyped_defs）；
# 第三方库按实际情况豁免 missing import；测试与实验脚本不纳入。
[mypy]
python_version = 3.13
packages = rvc, gui
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True

[mypy-tests.*]
disallow_untyped_defs = False

# ── 渐进收紧豁免：以下模块尚未完成全量注解，逐包摘除 ──
# 已完成：rvc.dsp/ io/ runtime/ core/ nn/ models/、gui.styles、gui.view.widgets
[mypy-rvc.pipeline.*]
ignore_errors = True

[mypy-rvc.streaming.*]
ignore_errors = True

[mypy-rvc.train.*]
ignore_errors = True

[mypy-gui.state.*]
ignore_errors = True

[mypy-gui.configs.*]
ignore_errors = True

[mypy-gui.controller.*]
ignore_errors = True

[mypy-gui.view.tabs.*]
ignore_errors = True

[mypy-gui.view.lifecycle]
ignore_errors = True

[mypy-gui.view.window]
ignore_errors = True

[mypy-gui.view.tray]
ignore_errors = True

[mypy-gui.view.main]
ignore_errors = True

# 无 stub 的第三方库
[mypy-sounddevice.*]
ignore_missing_imports = True
